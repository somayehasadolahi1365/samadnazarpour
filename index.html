<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مطب دکتر صمد نظرپور</title>

<style>
body {
    font-family: Arial, sans-serif;
    background:#f5f8fc;
    margin:0;
    padding:20px;
    color:#17324d;
}
.container {
    max-width:500px;
    margin:auto;
}
.card {
    background:white;
    border-radius:18px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}
h1 {
    font-size:22px;
    margin-bottom:5px;
}
.subtitle {
    color:#64748b;
    margin-bottom:20px;
}
label {
    display:block;
    margin-top:14px;
    margin-bottom:6px;
    font-weight:bold;
}
input, select {
    width:100%;
    box-sizing:border-box;
    padding:12px;
    border:1px solid #d6dde7;
    border-radius:10px;
    font-size:15px;
}
button {
    width:100%;
    padding:14px;
    border:0;
    border-radius:12px;
    background:#1976d2;
    color:white;
    font-size:16px;
    margin-top:18px;
}
.info {
    background:#eef6ff;
    padding:12px;
    border-radius:10px;
    line-height:1.8;
}
</style>
</head>

<body>

<div class="container">

<div class="card">
<h1>مطب دکتر صمد نظرپور</h1>
<div class="subtitle">فوق تخصص روماتولوژی</div>

<div class="info">
📍 خرم‌آباد، میدان کیو<br>
طبقه بالای داروخانه موسوی‌نیا<br>
💰 حق ویزیت: ۶٬۰۰۰٬۰۰۰ ریال
</div>
</div>

<div class="card">

<label>انتخاب روز</label>
<select>
<option>شنبه</option>
<option>یکشنبه</option>
<option>دوشنبه</option>
<option>چهارشنبه</option>
</select>

<label>انتخاب ساعت</label>
<select>
<option>۱۲:۰۰</option>
<option>۱۳:۰۰</option>
<option>۱۴:۰۰</option>
<option>۱۵:۰۰</option>
<option>۱۶:۰۰</option>
<option>۱۷:۰۰</option>
<option>۱۸:۰۰</option>
<option>۱۹:۰۰</option>
<option>۲۰:۰۰</option>
</select>

<label>نام و نام خانوادگی</label>
<input type="text" placeholder="نام بیمار">

<label>کد ملی</label>
<input type="text" inputmode="numeric" placeholder="کد ملی">

<label>شماره موبایل</label>
<input type="tel" placeholder="09xxxxxxxxx">

<label>نوع بیمه</label>
<select>
<option>نیروهای مسلح</option>
<option>تأمین اجتماعی</option>
<option>بیمه سلامت</option>
<option>آزاد</option>
</select>

<button>ثبت نوبت و پرداخت</button>

</div>

</div>

</body>
</html>
